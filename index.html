<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Gallery | Immanuel Oheneba Debe</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="gallery.css" />
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="header-top">
      <div class="header-title">
        <h1>The <span>Gallery</span></h1>
        <p>A curated collection of images across different categories</p>
      </div>
      <div class="header-meta">
        <div class="image-count">
          <span id="imageCount">9</span>
          <span>images</span>
        </div>
      </div>
    </div>

    <!-- FILTER TABS (injected by JS) -->
    <div class="filters" id="filters"></div>
  </header>

  <!-- GALLERY GRID -->
  <main>
    <div class="gallery-grid" id="galleryGrid"></div>
    <div class="empty-state" id="emptyState">
      <p>No images found in this category.</p>
    </div>
  </main>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox-content">
      <button class="lightbox-close" id="lbClose">✕</button>
      <img id="lbImg" src="" alt="" />
      <div class="lightbox-info">
        <div>
          <div class="caption-title" id="lbTitle"></div>
          <span class="caption-sub" id="lbCategory"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <p>Designed & built by <span>Immanuel Oheneba Debe</span> · <span id="year"></span></p>
  </footer>

  <script src="gallery.js"></script>
</body>

</html>
